name: tfu-bbdd-actividad1

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carburantes
      POSTGRES_USER: laboratorio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "laboratorio", "-d", "carburantes"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
