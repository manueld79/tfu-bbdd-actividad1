name: tfu-bbdd-entrega

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carburantes
      POSTGRES_USER: laboratorio
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTRES_PASSWORD en .env}"
    volumes:
      - pgdata:/var/lib/postgres/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "laboratorio", "-d", "carburantes"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata: